<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
:root {
  --cexieweb-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --cexieweb-font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;

  --cexieweb-background: #0f1722;
  --cexieweb-foreground: #e7eef7;
  --cexieweb-card: #162131;
  --cexieweb-card-foreground: #e7eef7;
  --cexieweb-popover: #182537;
  --cexieweb-popover-foreground: #edf4ff;
  --cexieweb-muted: #1d2b3d;
  --cexieweb-muted-foreground: #8ea1b7;
  --cexieweb-border: #233347;
  --cexieweb-input: #24374d;
  --cexieweb-ring: #4a8dc9;

  --cexieweb-primary: #4a8dc9;
  --cexieweb-primary-foreground: #f6fbff;
  --cexieweb-primary-strong: #6ba7dc;
  --cexieweb-primary-soft: #17314d;
  --cexieweb-primary-surface: #13283f;

  --cexieweb-state-success: #49b38a;
  --cexieweb-state-success-surface: #132b24;
  --cexieweb-state-warning: #d7a24d;
  --cexieweb-state-warning-surface: #342713;
  --cexieweb-state-error: #df7171;
  --cexieweb-state-error-surface: #35191d;
  --cexieweb-state-info: #68a7db;
  --cexieweb-state-info-surface: #11263a;

  --cexieweb-radius-sm: 8px;
  --cexieweb-radius-md: 12px;
  --cexieweb-radius-lg: 16px;

  --cexieweb-shadow-1: 0 6px 18px rgba(3, 9, 18, 0.18);
  --cexieweb-shadow-2: 0 18px 48px rgba(3, 9, 18, 0.28);

  --cexieweb-space-1: 4px;
  --cexieweb-space-2: 8px;
  --cexieweb-space-3: 12px;
  --cexieweb-space-4: 16px;
  --cexieweb-space-5: 24px;
  --cexieweb-space-6: 32px;
  --cexieweb-space-7: 48px;
  --cexieweb-space-8: 80px;
}

.light {
  --cexieweb-background: #f3f7fb;
  --cexieweb-foreground: #122032;
  --cexieweb-card: #ffffff;
  --cexieweb-card-foreground: #122032;
  --cexieweb-popover: #ffffff;
  --cexieweb-popover-foreground: #122032;
  --cexieweb-muted: #e8eef5;
  --cexieweb-muted-foreground: #66798d;
  --cexieweb-border: #d9e3ee;
  --cexieweb-input: #d0dde9;
  --cexieweb-ring: #3f7db6;
  --cexieweb-primary: #2f6fa9;
  --cexieweb-primary-foreground: #f8fbff;
  --cexieweb-primary-strong: #184d7d;
  --cexieweb-primary-soft: #d8e8f6;
  --cexieweb-primary-surface: #eaf3fb;
  --cexieweb-state-success: #25805d;
  --cexieweb-state-success-surface: #e5f5ee;
  --cexieweb-state-warning: #9b6a22;
  --cexieweb-state-warning-surface: #fbf2e6;
  --cexieweb-state-error: #bf4e58;
  --cexieweb-state-error-surface: #faebee;
  --cexieweb-state-info: #2f6fa9;
  --cexieweb-state-info-surface: #eaf3fb;
  --cexieweb-shadow-1: 0 4px 12px rgba(12, 30, 52, 0.05);
  --cexieweb-shadow-2: 0 18px 42px rgba(12, 30, 52, 0.12);
}

body {
  font-family: var(--cexieweb-font-sans);
  background: var(--cexieweb-background);
  color: var(--cexieweb-foreground);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--cexieweb-background);
    --color-foreground: var(--cexieweb-foreground);
    --color-card: var(--cexieweb-card);
    --color-card-foreground: var(--cexieweb-card-foreground);
    --color-popover: var(--cexieweb-popover);
    --color-popover-foreground: var(--cexieweb-popover-foreground);
    --color-primary: var(--cexieweb-primary);
    --color-primary-foreground: var(--cexieweb-primary-foreground);
    --color-muted: var(--cexieweb-muted);
    --color-muted-foreground: var(--cexieweb-muted-foreground);
    --color-border: var(--cexieweb-border);
    --color-input: var(--cexieweb-input);
    --color-ring: var(--cexieweb-ring);
    --radius-sm: var(--cexieweb-radius-sm);
    --radius-md: var(--cexieweb-radius-md);
    --radius-lg: var(--cexieweb-radius-lg);
  }
  @layer base {
    body { background: var(--cexieweb-background); color: var(--cexieweb-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--cexieweb-background); }
      .text-background { color: var(--cexieweb-background); }
      .border-background { border-color: var(--cexieweb-background); }
      .ring-background { --tw-ring-color: var(--cexieweb-background); }
      .bg-foreground { background-color: var(--cexieweb-foreground); }

      .border-card { border-color: var(--cexieweb-card); }
      .ring-card { --tw-ring-color: var(--cexieweb-card); }
      .bg-card-foreground { background-color: var(--cexieweb-card-foreground); }
      .text-card-foreground { color: var(--cexieweb-card-foreground); }
      .border-card-foreground { border-color: var(--cexieweb-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--cexieweb-card-foreground); }
      .bg-popover { background-color: var(--cexieweb-popover); }
      .text-popover { color: var(--cexieweb-popover); }
      .border-popover { border-color: var(--cexieweb-popover); }
      .ring-popover { --tw-ring-color: var(--cexieweb-popover); }
      .bg-popover-foreground { background-color: var(--cexieweb-popover-foreground); }
      .text-popover-foreground { color: var(--cexieweb-popover-foreground); }
      .border-popover-foreground { border-color: var(--cexieweb-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--cexieweb-popover-foreground); }
      .bg-primary { background-color: var(--cexieweb-primary); }
      .text-primary { color: var(--cexieweb-primary); }
      .border-primary { border-color: var(--cexieweb-primary); }
      .ring-primary { --tw-ring-color: var(--cexieweb-primary); }
      .bg-primary-foreground { background-color: var(--cexieweb-primary-foreground); }
      .text-primary-foreground { color: var(--cexieweb-primary-foreground); }
      .border-primary-foreground { border-color: var(--cexieweb-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--cexieweb-primary-foreground); }
      .bg-muted { background-color: var(--cexieweb-muted); }
      .text-muted { color: var(--cexieweb-muted); }
      .border-muted { border-color: var(--cexieweb-muted); }
      .ring-muted { --tw-ring-color: var(--cexieweb-muted); }
      .bg-muted-foreground { background-color: var(--cexieweb-muted-foreground); }
      .text-muted-foreground { color: var(--cexieweb-muted-foreground); }
      .border-muted-foreground { border-color: var(--cexieweb-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--cexieweb-muted-foreground); }
      .bg-border { background-color: var(--cexieweb-border); }
      .text-border { color: var(--cexieweb-border); }
      .border-border { border-color: var(--cexieweb-border); }
      .ring-border { --tw-ring-color: var(--cexieweb-border); }
      .bg-input { background-color: var(--cexieweb-input); }
      .text-input { color: var(--cexieweb-input); }
      .border-input { border-color: var(--cexieweb-input); }
      .ring-input { --tw-ring-color: var(--cexieweb-input); }
      .bg-ring { background-color: var(--cexieweb-ring); }
      .text-ring { color: var(--cexieweb-ring); }
      .border-ring { border-color: var(--cexieweb-ring); }
      .ring-ring { --tw-ring-color: var(--cexieweb-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
