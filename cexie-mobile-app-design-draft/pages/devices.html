<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备</title>
    <style id="theme-vars">
:root {
  --cexie-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --cexie-font-mono: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  --cexie-background: #f3f6fa;
  --cexie-foreground: #1a2430;
  --cexie-muted: #eef3f8;
  --cexie-muted-foreground: #667589;
  --cexie-card: #ffffff;
  --cexie-card-foreground: #1a2430;
  --cexie-border: #d6e0ea;
  --cexie-divider: #e7edf3;
  --cexie-primary: #2f5e8a;
  --cexie-primary-strong: #244767;
  --cexie-primary-soft: #dce8f3;
  --cexie-primary-surface: #edf4fa;
  --cexie-primary-foreground: #ffffff;
  --cexie-success: #2f7a61;
  --cexie-success-surface: #e7f4ee;
  --cexie-warning: #a46c25;
  --cexie-warning-surface: #fbf2e5;
  --cexie-error: #b25454;
  --cexie-error-surface: #faecec;
  --cexie-info: #406f9a;
  --cexie-info-surface: #eaf1f8;
  --cexie-radius-xs: 6px;
  --cexie-radius-sm: 8px;
  --cexie-radius-md: 12px;
  --cexie-radius-lg: 16px;
  --cexie-shadow-1: 0 4px 12px rgba(20, 36, 54, 0.04);
  --cexie-shadow-2: 0 10px 24px rgba(20, 36, 54, 0.05);
}
.dark {
  --cexie-background: #111922;
  --cexie-foreground: #e7edf4;
  --cexie-muted: #18232f;
  --cexie-muted-foreground: #93a2b4;
  --cexie-card: #16212c;
  --cexie-card-foreground: #e7edf4;
  --cexie-border: #273747;
  --cexie-divider: #223241;
  --cexie-primary: #5f88b1;
  --cexie-primary-strong: #7a9fc3;
  --cexie-primary-soft: #213549;
  --cexie-primary-surface: #182837;
  --cexie-primary-foreground: #f8fbff;
  --cexie-success: #5ca58c;
  --cexie-success-surface: #173126;
  --cexie-warning: #cea15e;
  --cexie-warning-surface: #392c18;
  --cexie-error: #d68888;
  --cexie-error-surface: #351f1f;
  --cexie-info: #7aa8cf;
  --cexie-info-surface: #1b2d3f;
}
body { font-family: var(--cexie-font-sans); color: var(--cexie-foreground); background: var(--cexie-background); }
.cexie-h1 { font-size: 24px; line-height: 1.24; font-weight: 700; letter-spacing: -0.02em; }
.cexie-h2 { font-size: 18px; line-height: 1.35; font-weight: 700; }
.cexie-h3 { font-size: 16px; line-height: 1.4; font-weight: 600; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--cexie-background);
    --color-foreground: var(--cexie-foreground);
    --color-card: var(--cexie-card);
    --color-card-foreground: var(--cexie-card-foreground);
    --color-primary: var(--cexie-primary);
    --color-primary-foreground: var(--cexie-primary-foreground);
    --color-muted: var(--cexie-muted);
    --color-muted-foreground: var(--cexie-muted-foreground);
    --color-border: var(--cexie-border);
  }
  @layer base {
    body { background: var(--cexie-background); color: var(--cexie-foreground); }
  }
    </style>
</head>
<body class="min-h-screen bg-[var(--cexie-background)] text-[var(--cexie-foreground)]">
  <main class="mx-auto w-full max-w-md px-4 pb-24 pt-4 sm:max-w-lg">
    <header class="sticky top-0 z-20 -mx-4 border-b border-[var(--cexie-border)] bg-[var(--cexie-background)]/96 px-4 py-3 backdrop-blur">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="truncate text-[12px] text-[var(--cexie-muted-foreground)]">设备入口</p>
          <h1 class="cexie-h2 truncate">所有设备</h1>
        </div>
        <button type="button" class="inline-flex h-9 items-center justify-center rounded-[var(--cexie-radius-sm)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-3 text-[13px] font-medium text-[var(--cexie-primary)]">
          <i data-lucide="refresh-cw" class="mr-1.5 h-4 w-4"></i>
          刷新
        </button>
      </div>
      <div class="mt-3 grid gap-2">
        <button type="button" class="inline-flex h-10 items-center justify-between rounded-[var(--cexie-radius-sm)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-3 text-left">
          <span class="truncate text-[13px] font-medium">工程筛选：全部工程</span>
          <i data-lucide="chevrons-up-down" class="h-4 w-4 shrink-0 text-[var(--cexie-muted-foreground)]"></i>
        </button>
        <div class="flex gap-2 overflow-x-auto">
          <button class="inline-flex h-9 shrink-0 items-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-primary)] px-4 text-[12px] font-semibold text-[var(--cexie-primary-foreground)]">全部</button>
          <button class="inline-flex h-9 shrink-0 items-center rounded-[var(--cexie-radius-xs)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-4 text-[12px] font-semibold text-[var(--cexie-muted-foreground)]">在线</button>
          <button class="inline-flex h-9 shrink-0 items-center rounded-[var(--cexie-radius-xs)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-4 text-[12px] font-semibold text-[var(--cexie-muted-foreground)]">离线</button>
          <button class="inline-flex h-9 shrink-0 items-center rounded-[var(--cexie-radius-xs)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-4 text-[12px] font-semibold text-[var(--cexie-muted-foreground)]">故障</button>
        </div>
      </div>
    </header>

    <section class="mt-4 rounded-[var(--cexie-radius-lg)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-4 shadow-[var(--cexie-shadow-1)]">
      <div class="flex items-center justify-between gap-3">
        <h2 class="cexie-h3 truncate">设备列表</h2>
        <span class="text-[12px] text-[var(--cexie-muted-foreground)]">当前：全部工程</span>
      </div>
      <div class="mt-3 space-y-3">
        <article id="device-card-open" data-dom-id="device-card-open" class="rounded-[var(--cexie-radius-md)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-3 shadow-[var(--cexie-shadow-1)]">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <p class="truncate text-[14px] font-semibold">CX-GW-07</p>
                <span class="inline-flex h-6 items-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-success-surface)] px-2 text-[11px] font-semibold text-[var(--cexie-success)]">在线</span>
              </div>
              <p class="mt-1 text-[12px] text-[var(--cexie-muted-foreground)]">IMEI：861002340045781 · 南城深基坑三期监测</p>
              <div class="mt-2 grid grid-cols-2 gap-x-4 gap-y-2 text-[12px] text-[var(--cexie-muted-foreground)]">
                <p>网络：4G</p>
                <p>信号：-71dBm</p>
                <p>最后在线：11:23:18</p>
                <p>绑定测孔：8 个</p>
              </div>
            </div>
            <button type="button" class="mt-0.5 inline-flex h-8 shrink-0 items-center justify-center rounded-[var(--cexie-radius-xs)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-3 text-[12px] font-semibold text-[var(--cexie-primary)]">进入操作</button>
          </div>
        </article>

        <article class="rounded-[var(--cexie-radius-md)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-3 shadow-[var(--cexie-shadow-1)]">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <p class="truncate text-[14px] font-semibold">CX-GW-12</p>
                <span class="inline-flex h-6 items-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-warning-surface)] px-2 text-[11px] font-semibold text-[var(--cexie-warning)]">故障</span>
              </div>
              <p class="mt-1 text-[12px] text-[var(--cexie-muted-foreground)]">IMEI：861002340045826 · 南城深基坑三期监测</p>
              <div class="mt-2 grid grid-cols-2 gap-x-4 gap-y-2 text-[12px] text-[var(--cexie-muted-foreground)]">
                <p>网络：4G</p>
                <p>信号：-93dBm</p>
                <p>最后在线：11:18:42</p>
                <p>绑定测孔：6 个</p>
              </div>
            </div>
            <button type="button" class="mt-0.5 inline-flex h-8 shrink-0 items-center justify-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-primary)] px-3 text-[12px] font-semibold text-[var(--cexie-primary-foreground)]">进入操作</button>
          </div>
        </article>

        <article class="rounded-[var(--cexie-radius-md)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-3 shadow-[var(--cexie-shadow-1)]">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <p class="truncate text-[14px] font-semibold">CX-GW-14</p>
                <span class="inline-flex h-6 items-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-info-surface)] px-2 text-[11px] font-semibold text-[var(--cexie-info)]">待确认</span>
              </div>
              <p class="mt-1 text-[12px] text-[var(--cexie-muted-foreground)]">IMEI：861002340045833 · 北坡边坡稳定性监测</p>
              <div class="mt-2 grid grid-cols-2 gap-x-4 gap-y-2 text-[12px] text-[var(--cexie-muted-foreground)]">
                <p>网络：以太网</p>
                <p>信号：稳定</p>
                <p>最后在线：11:20:09</p>
                <p>绑定测孔：12 个</p>
              </div>
            </div>
            <button type="button" class="mt-0.5 inline-flex h-8 shrink-0 items-center justify-center rounded-[var(--cexie-radius-xs)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] px-3 text-[12px] font-semibold text-[var(--cexie-primary)]">进入操作</button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 border-t border-[var(--cexie-border)] bg-[var(--cexie-card)]/98 backdrop-blur">
    <div class="mx-auto grid max-w-md grid-cols-3 px-3 py-2 sm:max-w-lg">
      <button id="nav-projects" data-dom-id="nav-projects" class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-muted-foreground)]">
        <i data-lucide="folder-kanban" class="h-4 w-4"></i>
        <span class="text-[11px] font-medium">工程</span>
      </button>
      <button class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-primary)]">
        <i data-lucide="cpu" class="h-4 w-4"></i>
        <span class="text-[11px] font-medium">设备</span>
      </button>
      <button id="nav-profile" data-dom-id="nav-profile" class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-muted-foreground)]">
        <i data-lucide="user-round" class="h-4 w-4"></i>
        <span class="text-[11px] font-medium">我的</span>
      </button>
    </div>
  </nav>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
