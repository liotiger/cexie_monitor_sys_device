<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <style id="theme-vars">
:root {
  --cexie-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --cexie-font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;

  --cexie-background: #f4f7fb;
  --cexie-foreground: #1f2937;
  --cexie-muted: #eef3f8;
  --cexie-muted-foreground: #66758b;
  --cexie-card: #ffffff;
  --cexie-card-foreground: #1f2937;
  --cexie-border: #d7e0ea;
  --cexie-divider: #e6edf4;

  --cexie-primary: #2d5f93;
  --cexie-primary-strong: #21496f;
  --cexie-primary-soft: #dde8f3;
  --cexie-primary-surface: #edf4fb;
  --cexie-primary-foreground: #ffffff;

  --cexie-success: #2f7c63;
  --cexie-success-surface: #e7f4ef;
  --cexie-warning: #a56b1f;
  --cexie-warning-surface: #fbf2e6;
  --cexie-error: #b14f4f;
  --cexie-error-surface: #faecec;
  --cexie-info: #3b6f98;
  --cexie-info-surface: #eaf2f8;

  --cexie-radius-xs: 6px;
  --cexie-radius-sm: 8px;
  --cexie-radius-md: 12px;
  --cexie-radius-lg: 16px;

  --cexie-shadow-1: 0 4px 12px rgba(18, 37, 56, 0.04);
  --cexie-shadow-2: 0 10px 24px rgba(18, 37, 56, 0.05);

  --cexie-spacing-1: 4px;
  --cexie-spacing-2: 8px;
  --cexie-spacing-3: 12px;
  --cexie-spacing-4: 16px;
  --cexie-spacing-5: 20px;
  --cexie-spacing-6: 24px;
}

.dark {
  --cexie-background: #0f1722;
  --cexie-foreground: #e8eef5;
  --cexie-muted: #172230;
  --cexie-muted-foreground: #93a4b8;
  --cexie-card: #16212d;
  --cexie-card-foreground: #e8eef5;
  --cexie-border: #243444;
  --cexie-divider: #223241;

  --cexie-primary: #5b87b5;
  --cexie-primary-strong: #7da1c6;
  --cexie-primary-soft: #203549;
  --cexie-primary-surface: #172737;
  --cexie-primary-foreground: #f7fbff;

  --cexie-success: #59a68a;
  --cexie-success-surface: #173127;
  --cexie-warning: #d1a05c;
  --cexie-warning-surface: #382b18;
  --cexie-error: #d68484;
  --cexie-error-surface: #351e1e;
  --cexie-info: #79a7cf;
  --cexie-info-surface: #1a2d3f;
}

body {
  font-family: var(--cexie-font-sans);
  color: var(--cexie-foreground);
  background: var(--cexie-background);
}

.cexie-display {
  font-family: var(--cexie-font-sans);
  font-size: clamp(28px, 7vw, 34px);
  line-height: 1.18;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.cexie-h1 {
  font-family: var(--cexie-font-sans);
  font-size: 24px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.cexie-h2 {
  font-family: var(--cexie-font-sans);
  font-size: 18px;
  line-height: 1.35;
  font-weight: 700;
}

.cexie-h3 {
  font-family: var(--cexie-font-sans);
  font-size: 16px;
  line-height: 1.4;
  font-weight: 600;
}

.cexie-body {
  font-family: var(--cexie-font-sans);
  font-size: 14px;
  line-height: 1.6;
  font-weight: 400;
}

.cexie-caption {
  font-family: var(--cexie-font-sans);
  font-size: 12px;
  line-height: 1.5;
  font-weight: 500;
}

.cexie-metric {
  font-family: var(--cexie-font-sans);
  font-size: clamp(24px, 6vw, 30px);
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.03em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--cexie-background);
    --color-foreground: var(--cexie-foreground);
    --color-card: var(--cexie-card);
    --color-card-foreground: var(--cexie-card-foreground);
    --color-primary: var(--cexie-primary);
    --color-primary-foreground: var(--cexie-primary-foreground);
    --color-muted: var(--cexie-muted);
    --color-muted-foreground: var(--cexie-muted-foreground);
    --color-border: var(--cexie-border);
  }
  @layer base {
    body { background: var(--cexie-background); color: var(--cexie-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen bg-[var(--cexie-background)] text-[var(--cexie-foreground)]">
  <main class="mx-auto w-full max-w-md px-4 pb-28 pt-4 sm:max-w-lg">
    <header class="sticky top-0 z-20 -mx-4 border-b border-[var(--cexie-border)] bg-[var(--cexie-background)]/96 px-4 py-3 backdrop-blur">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="truncate text-[12px] text-[var(--cexie-muted-foreground)]">个人中心</p>
          <h1 class="cexie-h2 truncate">我的工作台</h1>
        </div>
        <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-[var(--cexie-radius-sm)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] text-[var(--cexie-primary)]">
          <i data-lucide="settings-2" class="h-4 w-4"></i>
        </button>
      </div>
    </header>

    <section class="mt-4 rounded-[var(--cexie-radius-lg)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-4 shadow-[var(--cexie-shadow-1)]">
      <div class="flex items-start gap-4">
        <div class="inline-flex h-14 w-14 shrink-0 items-center justify-center rounded-[var(--cexie-radius-md)] bg-[var(--cexie-primary)] text-[20px] font-bold text-[var(--cexie-primary-foreground)]">张</div>
        <div class="min-w-0 flex-1">
          <h2 class="truncate text-[18px] font-semibold">张工</h2>
          <div class="mt-2 flex flex-nowrap gap-2 overflow-x-auto">
            <span class="inline-flex h-7 shrink-0 items-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-primary-soft)] px-2.5 text-[12px] font-semibold text-[var(--cexie-primary)]">项目经理</span>
            <span class="inline-flex h-7 shrink-0 items-center rounded-[var(--cexie-radius-xs)] bg-[var(--cexie-info-surface)] px-2.5 text-[12px] font-semibold text-[var(--cexie-info)]">客户端</span>
          </div>
          <p class="mt-2 truncate text-[12px] text-[var(--cexie-muted-foreground)]">所属单位：南城岩土监测事业部</p>
          <p class="mt-1 line-clamp-2 text-[12px] leading-5 text-[var(--cexie-muted-foreground)]">负责项目统筹、告警复核与周报审核，移动端默认接收重点项目异常提醒。</p>
        </div>
      </div>
    </section>

    <section class="mt-4 rounded-[var(--cexie-radius-lg)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-4 shadow-[var(--cexie-shadow-1)]">
      <h2 class="cexie-h3 truncate">工作统计</h2>
      <div class="mt-4 grid grid-cols-3 gap-3">
        <div class="min-w-0 border-r border-[var(--cexie-divider)] pr-2">
          <p class="truncate text-[12px] text-[var(--cexie-muted-foreground)]">负责项目</p>
          <p class="mt-1 whitespace-nowrap text-[22px] font-bold text-[var(--cexie-primary)]">08</p>
        </div>
        <div class="min-w-0 border-r border-[var(--cexie-divider)] px-2">
          <p class="truncate text-[12px] text-[var(--cexie-muted-foreground)]">待处理告警</p>
          <p class="mt-1 whitespace-nowrap text-[22px] font-bold text-[var(--cexie-warning)]">03</p>
        </div>
        <div class="min-w-0 pl-2">
          <p class="truncate text-[12px] text-[var(--cexie-muted-foreground)]">待审核报表</p>
          <p class="mt-1 whitespace-nowrap text-[22px] font-bold text-[var(--cexie-success)]">02</p>
        </div>
      </div>
    </section>

    <section class="mt-4 rounded-[var(--cexie-radius-lg)] border border-[var(--cexie-border)] bg-[var(--cexie-card)] p-4 shadow-[var(--cexie-shadow-1)]">
      <h2 class="cexie-h3 truncate">功能设置</h2>
      <div class="mt-3 divide-y divide-[var(--cexie-divider)]">
        <button class="flex w-full items-center justify-between gap-3 py-4 text-left first:pt-0">
          <div class="min-w-0">
            <p class="truncate text-[14px] font-semibold">账号安全</p>
            <p class="mt-1 truncate text-[12px] text-[var(--cexie-muted-foreground)]">密码、登录设备与权限校验</p>
          </div>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-[var(--cexie-muted-foreground)]"></i>
        </button>
        <button class="flex w-full items-center justify-between gap-3 py-4 text-left">
          <div class="min-w-0">
            <p class="truncate text-[14px] font-semibold">通知设置</p>
            <p class="mt-1 truncate text-[12px] text-[var(--cexie-muted-foreground)]">告警推送、日报提醒、任务状态通知</p>
          </div>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-[var(--cexie-muted-foreground)]"></i>
        </button>
        <button class="flex w-full items-center justify-between gap-3 py-4 text-left">
          <div class="min-w-0">
            <p class="truncate text-[14px] font-semibold">主题偏好</p>
            <p class="mt-1 truncate text-[12px] text-[var(--cexie-muted-foreground)]">浅色主题、字号密度、默认首页配置</p>
          </div>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-[var(--cexie-muted-foreground)]"></i>
        </button>
        <button class="flex w-full items-center justify-between gap-3 py-4 text-left last:pb-0">
          <div class="min-w-0">
            <p class="truncate text-[14px] font-semibold">帮助反馈</p>
            <p class="mt-1 truncate text-[12px] text-[var(--cexie-muted-foreground)]">常见问题、版本说明、意见提交</p>
          </div>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-[var(--cexie-muted-foreground)]"></i>
        </button>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 border-t border-[var(--cexie-border)] bg-[var(--cexie-card)]/98 backdrop-blur">
    <div class="mx-auto grid max-w-md grid-cols-5 px-2 py-2 sm:max-w-lg">
      <button id="nav-home" data-dom-id="nav-home" class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-muted-foreground)]">
        <i data-lucide="house" class="h-4 w-4"></i><span class="text-[11px] font-medium">首页</span>
      </button>
      <button id="nav-projects" data-dom-id="nav-projects" class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-muted-foreground)]">
        <i data-lucide="folder-kanban" class="h-4 w-4"></i><span class="text-[11px] font-medium">工程</span>
      </button>
      <button id="nav-trends" data-dom-id="nav-trends" class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-muted-foreground)]">
        <i data-lucide="chart-line" class="h-4 w-4"></i><span class="text-[11px] font-medium">趋势</span>
      </button>
      <button id="nav-reports" data-dom-id="nav-reports" class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-muted-foreground)]">
        <i data-lucide="file-text" class="h-4 w-4"></i><span class="text-[11px] font-medium">报表</span>
      </button>
      <button class="flex flex-col items-center gap-1 rounded-[var(--cexie-radius-xs)] py-1 text-[var(--cexie-primary)]">
        <i data-lucide="user-round" class="h-4 w-4"></i><span class="text-[11px] font-medium">我的</span>
      </button>
    </div>
  </nav>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
